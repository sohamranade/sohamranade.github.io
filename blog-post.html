<body>

  <!-- ======= Mobile nav toggle button ======= -->

  <!-- ======= Header ======= -->

    <div class="d-flex flex-column">

      <div class="profile">

      <nav id="navbar" class="nav-menu navbar">

          <li><a href="index.html#hero" class="nav-link scrollto"><i class="bx bx-home"></i> <span>Home</span></a></li>

  <!-- ======= Hero Section ======= -->
  <section id="hero" class="d-flex flex-column justify-content-center align-items-center">
    <div class="hero-container" data-aos="fade-in">
      <h1 id="blog-post-title">Blog Post</h1>
      <p id="blog-post-excerpt"></p>
    </div>
  </section><!-- End Hero -->

  <main id="main">
  <script>
    // Wait for blog post data to be available (assuming blogData is loaded)
    document.addEventListener("DOMContentLoaded", function () {
      // blogData should be defined in assets/js/blog-data.js
      // blog.js should set the current post, e.g., window.currentBlogPost
      function setHeroSection(post) {
        if (!post) return;
        document.getElementById('blog-post-title').textContent = post.title || 'Blog Post';
        document.getElementById('blog-post-excerpt').textContent = post.excerpt || '';
      }
      // Try to get the current blog post from blog.js
      if (window.currentBlogPost) {
        setHeroSection(window.currentBlogPost);
      } else if (window.blogData && window.blogData.length > 0) {
        // fallback: use the first post
        setHeroSection(window.blogData[0]);
      }
    });
  </script>

    <!-- ======= Blog Post Section ======= -->
    <section id="blog-post" class="blog-post">
      <div class="container">

        <div id="blog-post-content">
          <!-- Blog post content will be loaded here dynamically -->
          <div class="text-center">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Loading blog post...</p>
          </div>
        </div>

      </div>
    </section><!-- End Blog Post Section -->

  </main><!-- End #main -->
